# envsync.example.yaml — пример манифеста EnvSync без личных данных.
# Свой манифест кладётся в %LOCALAPPDATA%\EnvSync\envsync.yaml (или путь в settings.json: manifestPath)
# и хранится в приватном git-репозитории, чтобы на обеих машинах он был одинаковым.
#
# Проверка без изменений:   envsync manifest check
# Примерка на другую машину: envsync manifest check --machine LAPTOP-EXAMPLE --home D:\Users\me
# Применение к Syncthing:   envsync apply   (сначала dry-run, потом подтверждение)

# Версия схемы. Агент старее манифеста откажется его применять, чтобы не «понимать наполовину».
# 1 — папки и профили машин; 2 — добавляет раздел software (программы через winget).
schema: 2

# Переменные путей. Встроенные: {{user}}, {{home}}, {{appdata}}, {{localappdata}}, {{machine}}.
# {{sync_root}} по умолчанию равен {{home}}; на другой машине его можно переопределить (см. machines).
vars:
  work: "{{sync_root}}\\Work"

# Общие исключения для всех папок. Если раздел не указан, берётся список по умолчанию
# (кэши, node_modules, .git, незавершённые загрузки; см. internal/core/ignores.go).
# Если указан, заменяет список по умолчанию целиком: .git и кэши тогда надо перечислить самому.
# ignore:
#   - "(?i).git"

folders:
  # id одинаков на всех машинах и однозначно определяет папку; путь у каждой машины свой.
  - id: envsync-test
    path: "{{sync_root}}\\EnvSyncTest"
    test: true            # тестовая папка: разрешена, пока синк реальных данных выключен

  # Реальные папки добавляются на этапе 6, когда готовы откат и предохранитель массового удаления.
  # - id: projects
  #   path: "{{work}}\\Projects"
  #   keep_days: 60       # сколько дней хранить удалённое в «корзине» (по умолчанию 30)
  #   ignore: ["(?i)*.log"]  # дополнительные исключения только для этой папки

# Программы. Проверка: envsync software plan; установка: envsync software apply (с вашим подтверждением).
# Агент ничего не удаляет сам: удаляются только пакеты из remove, с флагом --uninstall и подтверждением по каждому.
software:
  winget:
    - id: Git.Git
    - id: Microsoft.VisualStudioCode
    - id: GoLang.Go
      version: "1.27.4"      # необязательно: закрепить версию
    # - id: Valve.Steam
    #   scope: user          # необязательно: user или machine
  # remove: [Some.Old.App]
  manual:                    # программы, которых нет в winget: показываются списком «поставить вручную»
    - name: "Пример: графический редактор"
      note: "ставится с сайта производителя"

# Профили машин: имя компьютера (без учёта регистра) -> переопределения.
machines:
  DESKTOP-EXAMPLE:
    vars:
      sync_root: "D:\\Sync"      # на этой машине синк живёт на диске D:
    software:
      skip: [Valve.Steam]        # на этой машине не ставить и не удалять
  LAPTOP-EXAMPLE:
    vars:
      sync_root: "C:\\Users\\{{user}}\\Sync"
    # folders:
    #   projects:
    #     skip: true            # на этой машине папку не синкаем
    #     path: "E:\\Other"      # или синкаем в другое место
